<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Wallet / Card shape -->
  <rect x="86" y="138" width="340" height="236" rx="40" fill="url(#card)"/>
  <!-- Top accent strip -->
  <rect x="86" y="182" width="340" height="26" fill="#e0e7ff"/>
  <!-- Two partner circles (husband + wife) -->
  <circle cx="176" cy="282" r="46" fill="#2563eb" fill-opacity="0.9"/>
  <circle cx="232" cy="282" r="46" fill="#ec4899" fill-opacity="0.88"/>
  <!-- Rising chart bars -->
  <rect x="308" y="294" width="22" height="40" rx="8" fill="#10b981"/>
  <rect x="340" y="266" width="22" height="68" rx="8" fill="#0ea5e9"/>
  <rect x="372" y="236" width="22" height="98" rx="8" fill="#4f46e5"/>
</svg>
