<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BugetFamilie">
  <meta name="description" content="Aplicație modernă de tracking cumpărături în familie, sincronizată cu Google Sheets.">
  <title>BugetFamilie — Tracking Cumpărături</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Desktop -->
    <aside class="sidebar">
      <div class="brand">
        <img src="./icons/icon.svg" alt="BugetFamilie">
        <div>
          <div class="brand-title">BugetFamilie</div>
          <div class="brand-sub">Tracking Google Sheets</div>
        </div>
      </div>

      <nav class="side-nav" aria-label="Navigație principală">
        <button class="side-btn active" data-view="dashboard">🏠 Acasă</button>
        <button class="side-btn" data-view="transactions">🧾 Cheltuieli</button>
        <button class="side-btn" data-view="analytics">📊 Statistici & Insights</button>
        <button class="side-btn" data-view="catalog">🏷️ Categorii & Valute</button>
        <button class="side-btn" data-view="settings">⚙️ Setări & Google Sheets</button>
      </nav>
    </aside>

    <!-- Main Column -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <img class="topbar-logo" src="./icons/icon.svg" alt="Logo">
          <div class="partner-switcher" role="group" aria-label="Profil activ">
            <button id="pill-p1" class="partner-pill p1 active" data-switch-partner="p1">Eu</button>
            <button id="pill-p2" class="partner-pill p2" data-switch-partner="p2">Soția</button>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="btn-sync" class="icon-btn" title="Sincronizează cu Google Sheets">
            <span id="sync-dot" class="sync-dot"></span>
            <span id="sync-label">Demo</span>
          </button>
          <button id="btn-theme" class="icon-btn" title="Schimbă tema (Deschis/Întunecat)" aria-label="Schimbă tema">🌙</button>
        </div>
      </header>

      <main id="view-root" class="content"></main>
    </div>

    <!-- Bottom Navigation Mobile -->
    <nav class="bottom-nav" aria-label="Navigație mobil">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-ic">🏠</span>
        <span>Acasă</span>
      </button>
      <button class="nav-item" data-view="transactions">
        <span class="nav-ic">🧾</span>
        <span>Cheltuieli</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <span class="nav-ic">📊</span>
        <span>Grafice</span>
      </button>
      <button class="nav-item" data-view="catalog">
        <span class="nav-ic">🏷️</span>
        <span>Categorii</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-ic">⚙️</span>
        <span>Setări</span>
      </button>
    </nav>

    <!-- Quick Add Floating Action Button -->
    <button id="fab-add" class="fab" title="Adaugă cheltuială nouă" aria-label="Adaugă cheltuială">+</button>
  </div>

  <!-- Modal Backdrop -->
  <div id="modal-main" class="modal-backdrop" role="dialog" aria-modal="true"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
